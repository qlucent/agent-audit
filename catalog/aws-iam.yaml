# AWS IAM action patterns -> effects. Common entries from the public Service Authorization Reference
# (docs.aws.amazon.com/service-authorization/latest/reference). Not exhaustive.
#
# Matching (case-insensitive, `*` is a glob): a policy action gets the union of every entry that
#   - the policy action covers (policy `s3:*` covers `s3:DeleteObject`; policy `*` covers every entry; a generic
#     `*:Verb*` entry is read in the policy's service, so policy `ec2:*` covers `*:Delete*`), or
#   - covers the policy action (entry `*:Delete*` covers policy `ec2:DeleteVpc`).
# An entry without a service prefix (only `*`) covers nothing but itself. Every other entry's effects must hold for
# every action its pattern matches (so no summary entries like `s3:*`: policy `s3:Get*` would inherit delete).
# test/classify.test.ts enforces both rules.
# The label comes from the entry equal to the policy action, if any.

- { pattern: "*", label: "Every action on every AWS service", effects: [read, write, delete, money, external-send, identity-admin, code-exec, bulk] }

# Generic verbs
- { pattern: "*:Get*", label: "Read resources", effects: [read] }
- { pattern: "*:BatchGet*", label: "Read resources", effects: [read] }
- { pattern: "*:List*", label: "List resources", effects: [read] }
- { pattern: "*:Describe*", label: "Describe resources", effects: [read] }
- { pattern: "*:Create*", label: "Create resources", effects: [write] }
- { pattern: "*:Put*", label: "Write resources", effects: [write] }
- { pattern: "*:Update*", label: "Update resources", effects: [write] }
- { pattern: "*:Modify*", label: "Modify resources", effects: [write] }
- { pattern: "*:Delete*", label: "Delete resources", effects: [delete] }
- { pattern: "*:Terminate*", label: "Terminate resources", effects: [delete] }

