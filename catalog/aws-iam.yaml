- { pattern: "iam:Remove*", label: "Remove IAM group members or profile roles", effects: [write, identity-admin] }
- { pattern: "iam:SetDefaultPolicyVersion", label: "Switch an IAM policy version", effects: [write, identity-admin] }
- { pattern: "iam:AttachUserPolicy", label: "Attach a managed policy to an IAM user", effects: [write, identity-admin] }
- { pattern: "iam:AttachRolePolicy", label: "Attach a managed policy to an IAM role", effects: [write, identity-admin] }
- { pattern: "iam:PutUserPolicy", label: "Write an inline policy on an IAM user", effects: [write, identity-admin] }
- { pattern: "iam:PutRolePolicy", label: "Write an inline policy on an IAM role", effects: [write, identity-admin] }
- { pattern: "iam:PassRole", label: "Pass an IAM role to a service", effects: [identity-admin] }
- { pattern: "iam:CreateAccessKey", label: "Create IAM access keys", effects: [write, identity-admin], data: [credentials] }
- { pattern: "iam:CreateUser", label: "Create IAM users", effects: [write, identity-admin] }
- { pattern: "iam:CreateLoginProfile", label: "Set an IAM user's console password", effects: [write, identity-admin], data: [credentials] }
- { pattern: "iam:Get*", label: "Read IAM configuration", effects: [read] }
- { pattern: "iam:List*", label: "List IAM configuration", effects: [read] }
- { pattern: "sts:AssumeRole*", label: "Assume another IAM role (takes on its permissions)", effects: [identity-admin] }
- { pattern: "cognito-idp:AdminCreateUser", label: "Create Cognito users", effects: [write, identity-admin], data: [pii] }
- { pattern: "cognito-idp:AdminDeleteUser", label: "Delete Cognito users", effects: [delete, identity-admin] }
- { pattern: "cognito-idp:AdminDisableUser", label: "Disable Cognito users", effects: [write, identity-admin] }
- { pattern: "cognito-idp:AdminSetUserPassword", label: "Set Cognito users' passwords", effects: [write, identity-admin], data: [credentials] }
- { pattern: "cognito-idp:AdminResetUserPassword", label: "Reset Cognito users' passwords", effects: [write, identity-admin] }

