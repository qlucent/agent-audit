# Name, description and param patterns -> data classes. Param patterns match a parameter's whole leaf name
# (customer.ssn -> "ssn"), so country_code never matches "code". Decision 2: the external-send mixing rule
# relies on param (or explicit description) evidence, so keep param lists strong and specific.
# not_patterns cancel name and description hits only, never param hits.

- data: phi
  name_patterns:
    - "patients?|medical records?|health records?|diagnos(is|es)|prescriptions?|lab results?|clinical notes?|ehr|emr"
    # FHIR clinical resources (hl7.org/fhir/resourcelist.html). Condition and Procedure are left out: too generic.
    - "observations?|encounters?|medication (requests?|statements?|administrations?|dispenses?)|allergy intolerances?|allergies|immuni[sz]ations?|diagnostic reports?|care plans?"
  param_patterns:
    - "patient|patient id|patient ids|patient reference|encounter|encounter id|mrn|medical record number|diagnosis code|icd 10 code"
  description_patterns:
    - "protected health information|medical records?|patient records?"
  not_patterns:
    - "count|stats|statistics|metrics|weather|telemetry"
    # Reference data, not records: encounter types, patient education materials, code lists.
    - "types?|education|materials?|codes?|categories|catalog"

# Generic words that are clinical only in an agent that already touches phi (FHIR Condition, Procedure, Coverage).
- data: phi
  context: phi
  name_patterns:
    - "conditions?|procedures?|coverages?|explanation of benefits"
  not_patterns:
    - "count|stats|statistics|metrics|weather|telemetry|types?|education|materials?|codes?|categories|catalog|stored|terms"

- data: pii
  name_patterns:
    - "customers?|contacts?|employees?|personal (data|details|info|information)"
  param_patterns:
    - "ssn|social security number|dob|date of birth|birth date|passport number|national id|national id number|tax id|driver license number|drivers license number"
  description_patterns:
    - "personal(ly identifiable)? (data|information)"
  not_patterns:
    - "count|stats|statistics|metrics|segments?"

- data: financial-data
  name_patterns:
    - "bank accounts?|account balances?|balances?|(bank|card|account) statements?|card numbers?|credit cards?|iban|payroll"
    - "transactions?|pay stubs?|payslips?|pay slips?"
  param_patterns:
    - "card number|credit card number|iban|account number|bank account number|routing number|sort code|cvv|cvc|swift code|bic"
  not_patterns:
    - "count|stats|statistics|metrics"
    - "leave|pto|vacation|sick|load|token|tokens"
    - "begin|commit|rollback|start|database|db"

- data: credentials
  name_patterns:
    - "secrets?|passwords?|credentials?|api keys?|private keys?|access keys?"
  param_patterns:
    - "password|passwd|new password|old password|current password|api key|secret|client secret|private key|access token|refresh token|auth token|bearer token|secret key|access key"
  not_patterns:
    - "rules?|polic(y|ies)|requirements?|strength|complexity|expire|expiry|expiration|length|reset|change|forgot"
